# Authentication uses Workload Identity Federation (no JSON keys).
# Docs: https://cloud.google.com/iam/docs/workload-identity-federation
name: ci-cd

on:
  push:
    branches: [main]            # deploy to dev on every push to main
    paths-ignore:
      - '**.md'                 # docs-only changes don't need a deployment
  pull_request:                 # run tests and checks on pull requests (no deployment)
  workflow_dispatch:            # manual run from the Actions tab
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev

# One run per branch at a time; never cancel a running 'terraform apply'.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write               # lets the job request the OIDC token that WIF exchanges

env:
  # Docs: https://cloud.google.com/artifact-registry/docs/docker/pushing-and-pulling
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/app
  TARGET_ENV: ${{ inputs.environment || 'dev' }}   # manual runs choose; pushes default to dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # Get the repository code onto the runner.
      - uses: actions/checkout@v4

      # Exchange GitHub's OIDC token for short-lived Google credentials.
      # Docs: https://github.com/google-github-actions/auth
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.CI_SA_EMAIL }}

      # Install the gcloud CLI, already authenticated by the step above.
      - uses: google-github-actions/setup-gcloud@v2

      # Let Docker push to Artifact Registry using the credentials from step 2.
      # Docs: https://cloud.google.com/artifact-registry/docs/docker/authentication
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      # Buildx gives us layer caching between runs.
      - uses: docker/setup-buildx-action@v3

      # Build and push the PHP-FPM image, tagged with the commit SHA
      #    (immutable and traceable: a rollback is just redeploying an older SHA).
      - name: Build and push php-fpm
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php-fpm/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/php-fpm:${{ github.sha }}
          cache-from: type=gha,scope=php-fpm
          cache-to: type=gha,scope=php-fpm,mode=max

      # Same for the Nginx image.
      - name: Build and push nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/nginx:${{ github.sha }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,scope=nginx,mode=max

  deploy:
    needs: build-and-push       # only deploy images that were pushed successfully
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}   # prod pauses for approval

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.CI_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      # Wrapper disabled so 'terraform output' prints clean values.
      # Docs: https://developer.hashicorp.com/terraform/tutorials/automation/github-actions
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Inputs that Terraform reads as TF_VAR_* variables (see variables.tf).
      - name: Export Terraform inputs
        run: |
          echo "TF_VAR_project_id=${{ vars.GCP_PROJECT_ID }}" >> "$GITHUB_ENV"
          echo "TF_VAR_environment=${TARGET_ENV}" >> "$GITHUB_ENV"
          echo "TF_VAR_image_tag=${{ github.sha }}" >> "$GITHUB_ENV"

      # The backend file picks this environment's state in the GCS bucket.
      - name: Terraform init
        working-directory: terraform
        run: terraform init -reconfigure -backend-config=environments/${TARGET_ENV}.backend.hcl

      # The tfvars file injects this environment's sizing and settings.
      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -var-file=environments/${TARGET_ENV}.tfvars -out=tfplan

      # Applying the saved plan guarantees that what was planned is what runs.
      - name: Terraform apply
        working-directory: terraform
        run: terraform apply tfplan

      # Upload static files to the bucket served by the load balancer under /static/.
      # Docs: https://cloud.google.com/sdk/gcloud/reference/storage/rsync
      - name: Sync static files
        run: >
          gcloud storage rsync app/public/static
          gs://${{ vars.GCP_PROJECT_ID }}-static-${TARGET_ENV}/static --recursive

      # Prove the deployment works end to end: Internet -> LB -> Cloud Run -> Nginx -> PHP-FPM -> Cloud SQL.
      # A brand-new load balancer can take a few minutes to answer, so retry.
      - name: Smoke test
        working-directory: terraform
        run: |
          URL="$(terraform output -raw cloud_run_url)"
          echo "Testing ${URL}/readyz"
          for attempt in $(seq 1 30); do
            status="$(curl -s -o /dev/null --max-time 10 -w '%{http_code}' "${URL}/readyz" || true)"
            echo "attempt ${attempt}: HTTP ${status}"
            if [ "${status}" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "Smoke test failed; last response:" >&2
          curl -si --max-time 10 "${URL}/readyz" >&2 || true
          exit 1