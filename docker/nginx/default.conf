server {
  listen 8080;
  server_name _;
  root /var/www/html/public;

  # Liveness probe, answered by Nginx itself (does not depend on PHP or the DB).
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Static files: served directly, cached by browsers for a week.
  location /static/ {
    expires 7d;
    add_header Cache-Control 'public';
    try_files $uri =404;
  }

  # Everything else goes to the front controller.
  location / {
    try_files $uri /index.php$is_args$args;
  }

  # Proxy PHP requests to PHP-FPM (FastCGI) in the sidecar container.
  location ~ ^/index\.php(/|$) {
    internal;                       # blocks direct /index.php requests
    include fastcgi_params;
    fastcgi_pass 127.0.0.1:9000;    # same network namespace as Nginx on Cloud Run
    # Must be the path as seen INSIDE the php-fpm container.
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
  }

  # Never execute any other PHP file.
  location ~ \.php$ {
    return 404;
  }
}