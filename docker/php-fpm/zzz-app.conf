; Named zzz- so it loads after the image's zz-docker.conf and overrides it.
[www]
; Listen on localhost only: Nginx runs in the same Cloud Run instance.
listen = 127.0.0.1:9000
; Default is to wipe env vars; without this getenv('DB_NAME') is empty.
clear_env = no
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500
; Send PHP worker output to stderr so it reaches Cloud Logging.
catch_workers_output = yes