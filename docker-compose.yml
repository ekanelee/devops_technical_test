# Reproduces the Cloud Run layout: nginx shares php's network namespace,
# so fastcgi_pass 127.0.0.1:9000 works exactly like the sidecar.
services:
  php:
    build:
      context: .
      dockerfile: docker/php-fpm/Dockerfile
    ports:
      - "8080:8080"      # published here because nginx joins this network namespace
    environment:
      APP_ENV: local
      DB_HOST: db
      DB_NAME: app
      DB_USER: app
      DB_PASS: localpass
    depends_on:
      - db

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    network_mode: "service:php"
    depends_on:
      - php

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: localpass
      MYSQL_ROOT_PASSWORD: rootpass